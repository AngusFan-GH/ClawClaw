appId: app.clawclaw.setup
productName: ClawClaw Setup
artifactName: ClawClaw-Setup-v${version}-${arch}.${ext}

directories:
  output: ../../release/windows-installer/shell

files:
  - package.json
  - dist-electron/**/*
  - dist/**/*

extraResources:
  - from: ../../release/windows-installer/manifest.json
    to: manifest.json
  - from: ../../release/windows-installer/ui
    to: ui
  - from: ../../release/windows-installer/runner
    to: runner

asar: true
npmRebuild: false

win:
  icon: ../../resources/icons/icon.ico
  target:
    - target: portable
      arch:
        - x64
        - arm64

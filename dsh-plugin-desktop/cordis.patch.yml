# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-cron-tasks
      name: dsh-plugin-desktop/cron-tasks
    - id: desktop-shortcuts
      name: dsh-plugin-desktop/shortcut-menu
    - id: desktop-plugin-registry-probe
      name: dsh-plugin-desktop/plugin-registry-probe
    - id: desktop-reminders
      name: dsh-plugin-desktop/reminders
    - id: desktop-default-workspace
      name: dsh-plugin-desktop/default-workspace
      config:
        path: !!js process.env.CLAWCLAW_DEFAULT_WORKSPACE
    - id: desktop-skills
      name: dsh-plugin-desktop/skills
    - id: desktop-legacy-agent-presets
      name: dsh-plugin-desktop/legacy-agent-presets
    - id: desktop-mcp
      name: dsh-plugin-desktop/mcp
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    # ClawClaw owns both expert faces. Keep the Remote row top-level so the
    # API gateway discovers its catalog routes before the browser mounts them.
    - id: clawclaw-experts-remote
      name: dsh-plugin-desktop/experts-remote
    - id: clawclaw-experts
      name: dsh-plugin-desktop/experts

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# ClawClaw does not collect feedback or upload session history. Keep the Host
# command, persistence/Remote service, browser controls, and telemetry backend
# disabled together so no feedback surface or collection interface remains.
- id: command-feedback
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: session-telemetry-otel
  disabled: true

# DSH 0.2.1 adds product analytics independently of Session feedback.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# ClawClaw keeps its established Desktop Cron model until a lossless Schedule
# migration protocol exists. Loading both models produces two unrelated task
# catalogs, so the upstream pair stays disabled in the Desktop profile.
- id: schedule
  disabled: true

- id: ui-schedule
  disabled: true

# Desktop reuses the rc.2 Plugins panel implementation but lets the configurable
# shortcut menu own its sidebar entry, so the upstream Client row must not also
# register a fixed entry.
- id: ui-plugin-manager
  disabled: true

# ClawClaw does not expose the upstream DeepSeek account surface. The desktop
# marker is still required to suppress browser-only onboarding, so disable the
# account client explicitly instead of relying on browser-mode detection.
- id: ui-settings-account
  disabled: true

# SpiritX is owned by the single official pi-ai instance. The empty catalog
# keeps the route visible without registering a second adapter or auth flows;
# a verified key materializes the live catalog through Models or onboarding.
- id: llm-pi-ai
  config:
    providers:
      spiritx:
        displayName: SpiritX
        apiKeyEnv: SPIRITX_API_KEY
        api: openai-responses
        baseURL: https://ai.xzinfra.com/spiritx-api/v1
        models: []

- id: agent-default-model
  config:
    provider: spiritx
    model: __unconfigured__

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# SpiritX search does not yet have a verified WebSearchProvider contract.
# Keep public HTTP fetching available without silently falling back to DeepSeek.
- id: web
  config:
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

# Desktop supplies its own ClawClaw identity through the client plugin.
- id: ui-brand-official
  disabled: true

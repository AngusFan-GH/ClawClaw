name: Release ClawClaw Desktop
on:
  workflow_dispatch:
  push:
    tags: ['clawclaw-v*']
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dsh-plugin-desktop
            artifact: macos
          - os: windows-latest
            package: dsh-plugin-desktop
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.2 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run upstream:prepare-runtime
      - name: Build signed macOS DMG
        if: matrix.artifact == 'macos'
        run: pnpm --filter ${{ matrix.package }} run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Build Windows installer
        if: matrix.artifact == 'windows'
        run: pnpm --filter ${{ matrix.package }} run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package }}/dist/**/*.dmg
            ${{ matrix.package }}/dist/**/*.zip
            ${{ matrix.package }}/dist/**/*.exe
            ${{ matrix.package }}/dist/**/*.yml
            ${{ matrix.package }}/dist/**/*.blockmap
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.2 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Assemble release metadata
        shell: bash
        env: { CHANNEL: stable }
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -name '*.dmg' -type f | wc -l)" = 1
          test "$(find release -maxdepth 1 -name '*.exe' -type f | wc -l)" = 1
          test "$(find release -maxdepth 1 -name 'latest.yml' -type f | wc -l)" = 1
          test "$(find release -maxdepth 1 -name 'latest-mac.yml' -type f | wc -l)" = 1
          node scripts/generate-release-manifest.mjs --directory release --output release/release.json --base-url "https://clawclaw.xzinfra.com/updates/dsh/$CHANNEL"
      - uses: actions/upload-artifact@v4
        with: { name: release, path: release/ }
      - name: Publish stable release to the update origin
        env:
          SSHPASS: ${{ secrets.UPDATE_PASSWORD }}
          CHANNEL: stable
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' '101.200.13.235 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPbPPFUw6R3s4V3iV41PNtMR/DRDwTJrZZhl02VtwWuu' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          archive="clawclaw-dsh-${GITHUB_RUN_ID}.tar.gz"
          tar -C release -czf "$archive" .
          ssh_base=(sshpass -e ssh -o StrictHostKeyChecking=yes root@101.200.13.235)
          scp_base=(sshpass -e scp -o StrictHostKeyChecking=yes)
          "${scp_base[@]}" "$archive" root@101.200.13.235:/tmp/"$archive"
          "${ssh_base[@]}" "CHANNEL=$CHANNEL ARCHIVE=/tmp/$archive bash -s" <<'REMOTE'
          set -euo pipefail
          root=/var/www/xzinfra
          stable="$root/updates/dsh/$CHANNEL"
          staging=$(mktemp -d "$root/updates/.incoming.XXXXXX")
          cleanup() { rm -rf "$staging" "$ARCHIVE"; }
          trap cleanup EXIT
          tar -xzf "$ARCHIVE" -C "$staging"
          test "$(find "$staging" -maxdepth 1 -name '*.dmg' -type f | wc -l)" = 1
          test "$(find "$staging" -maxdepth 1 -name '*.exe' -type f | wc -l)" = 1
          test -f "$staging/latest.yml"
          test -f "$staging/latest-mac.yml"
          test -f "$staging/release.json"
          version=$(node -p "JSON.parse(require('fs').readFileSync('$staging/release.json')).version")
          archive_dir="$root/releases/dsh/$version"
          install -d -m 0755 "$stable" "$archive_dir"
          find "$staging" -maxdepth 1 -type f ! -name '*.yml' ! -name 'release.json' -exec install -m 0644 {} "$archive_dir" \;
          find "$staging" -maxdepth 1 -type f ! -name '*.yml' ! -name 'release.json' -exec install -m 0644 {} "$stable" \;
          install -m 0644 "$staging/release.json" "$stable/release.json.new"
          install -m 0644 "$staging/latest.yml" "$stable/latest.yml.new"
          install -m 0644 "$staging/latest-mac.yml" "$stable/latest-mac.yml.new"
          mv "$stable/release.json.new" "$stable/release.json"
          mv "$stable/latest.yml.new" "$stable/latest.yml"
          mv "$stable/latest-mac.yml.new" "$stable/latest-mac.yml"
          REMOTE

name: Release ClawClaw Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Archive a formal GitHub release (select a version tag; deploy locally afterward)
        required: true
        type: boolean
        default: false
  push:
    tags: ['clawclaw-v*']

permissions:
  contents: read

concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Validate version and publication ref
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [[ "$REF_TYPE" == "tag" || "$PUBLISH" == "true" ]]; then
            test "$REF_TYPE" = "tag" && test "$REF_NAME" = "clawclaw-v$version" || {
              echo "Publishing requires the existing tag clawclaw-v$version" >&2
              exit 1
            }
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            platform: darwin
            installer: dsh-plugin-desktop/dist/mac-smoke/ClawClaw-*-universal.dmg
          - os: windows-latest
            artifact: windows
            platform: win32
            installer: dsh-plugin-desktop/dist/ClawClaw-*-x64-Setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "dir=$(corepack pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run upstream:prepare-runtime
      - name: Refresh desktop runtime dependencies
        run: pnpm install --frozen-lockfile
      - name: Complete headless gate
        run: corepack pnpm check
      - name: Build unsigned macOS Universal DMG
        if: matrix.artifact == 'macos'
        # The full gate above already built, typechecked and tested this output.
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: pnpm --filter dsh-plugin-desktop run dist:mac
      - name: Build unsigned Windows NSIS installer
        if: matrix.artifact == 'windows'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: pnpm --filter dsh-plugin-desktop run dist:win
      - name: Stage installer with build provenance
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          INSTALLER_PATTERN: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          # Expand the trusted matrix glob without word splitting.
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(compgen -G "$INSTALLER_PATTERN")
          test "${#files[@]}" = 1
          node scripts/github-release.mjs stage --platform "$PLATFORM" --file "${files[0]}" --output staged
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-platform-${{ matrix.artifact }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
          path: staged/

  assemble:
    name: Assemble release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-platform-*
          path: artifacts
      - name: Validate both builds and assemble the release
        run: node scripts/github-release.mjs assemble --input artifacts --output release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
          path: release/

  publish:
    name: Archive verified installers in GitHub Releases
    needs: assemble
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment: github-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release
      - name: Revalidate release bytes
        run: node scripts/upload-update.mjs --directory release --channel stable --dry-run
      - name: Publish a new version without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          test "$RELEASE_TAG" = "clawclaw-v$version"
          printf 'Commit: %s\nWorkflow: %s/%s/actions/runs/%s\n\nUnsigned macOS Universal DMG and Windows x64 installer. Deploy this verified release from the local workstation to the company server.\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-notes.txt"
          # Draft first: incomplete uploads never become a published release.
          # Existing releases (including drafts) fail creation; never use --clobber.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ClawClaw $version" --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "release/ClawClaw-$version-universal.dmg" \
            "release/ClawClaw-$version-x64-Setup.exe" \
            release/release.json release/build-info.json
          gh release edit "$RELEASE_TAG" --draft=false --latest

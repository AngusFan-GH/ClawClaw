name: Release ClawClaw Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled release to the stable update origin
        required: true
        type: boolean
        default: false
  push:
    tags: ['clawclaw-v*']

permissions:
  contents: read

concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Match a release tag to the desktop package version
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          test "$REF_NAME" = "clawclaw-v$version" || {
            echo "Release tag $REF_NAME does not match desktop package version $version" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run upstream:prepare-runtime
      - name: Refresh desktop runtime dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned macOS Universal DMG
        if: matrix.artifact == 'macos'
        run: pnpm --filter dsh-plugin-desktop run dist:mac
      - name: Build unsigned Windows NSIS installer
        if: matrix.artifact == 'windows'
        run: pnpm --filter dsh-plugin-desktop run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dsh-plugin-desktop/dist/mac-smoke/ClawClaw-*-universal.dmg
            dsh-plugin-desktop/dist/ClawClaw-*-x64-Setup.exe

  assemble:
    name: Assemble release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
      - name: Validate version and generate release.json
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL || 'https://clawclaw.xzinfra.com/updates/dsh/stable' }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./dsh-plugin-desktop/package.json').version")"
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "clawclaw-v$version" ]]; then
            echo "Release tag $REF_NAME does not match desktop package version $version" >&2
            exit 1
          fi
          mkdir release
          find artifacts -type f \
            \( -name "ClawClaw-$version-universal.dmg" \
              -o -name "ClawClaw-$version-x64-Setup.exe" \) \
            -exec cp {} release/ \;
          test -f "release/ClawClaw-$version-universal.dmg"
          test -f "release/ClawClaw-$version-x64-Setup.exe"
          test "$(find release -maxdepth 1 -type f | wc -l)" = 2
          node scripts/generate-release-manifest.mjs \
            --directory release \
            --output release/release.json \
            --base-url "$UPDATE_BASE_URL"
          node scripts/upload-update.mjs --directory release --channel stable --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          if-no-files-found: error
          retention-days: 30
          path: release/

  deploy:
    name: Publish stable update
    needs: assemble
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stable-update
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release
      - name: Configure update-origin SSH identity
        shell: bash
        env:
          UPDATE_SSH_PRIVATE_KEY: ${{ secrets.UPDATE_SSH_PRIVATE_KEY }}
          UPDATE_KNOWN_HOSTS: ${{ secrets.UPDATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SSH_PRIVATE_KEY"
          test -n "$UPDATE_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$UPDATE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$UPDATE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Upload installers and switch release.json
        shell: bash
        env:
          UPDATE_HOST: ${{ vars.UPDATE_HOST }}
          UPDATE_USER: ${{ vars.UPDATE_USER }}
          UPDATE_PORT: ${{ vars.UPDATE_PORT || '22' }}
          UPDATE_REMOTE_ROOT: ${{ vars.UPDATE_REMOTE_ROOT || '/var/www/xzinfra' }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_HOST"
          test -n "$UPDATE_USER"
          node scripts/upload-update.mjs --directory release --channel stable

# ClawClaw update origin. Legacy and DSH clients use separate feeds.
server {
    listen 80;
    server_name clawclaw.xzinfra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clawclaw.xzinfra.com;

    ssl_certificate /etc/ssl/certs/xzinfra.com.pem;
    ssl_certificate_key /etc/ssl/private/xzinfra.com.key;

    # Requires download-stats/nginx-log.conf in the http context.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/clawclaw-downloads/downloads.jsonl clawclaw_download if=$clawclaw_log_download;

    location ^~ /updates/ {
        alias /var/www/xzinfra/updates/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /releases/dsh/ {
        alias /var/www/xzinfra/releases/dsh/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        return 404;
    }
}

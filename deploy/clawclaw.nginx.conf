# ClawClaw update origin. Legacy and DSH clients use separate feeds.
server {
    listen 80;
    server_name clawclaw.xzinfra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clawclaw.xzinfra.com;

    ssl_certificate @@UPDATE_TLS_CERT@@;
    ssl_certificate_key @@UPDATE_TLS_KEY@@;

    # Requires download-stats/nginx-log.conf in the http context.
    access_log @@STATS_ACCESS_LOG@@ main;
    access_log @@STATS_LOG_DIR@@/downloads.jsonl clawclaw_download if=$clawclaw_log_download;

    location ^~ /updates/ {
        alias @@UPDATE_REMOTE_ROOT@@/updates/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /releases/dsh/ {
        alias @@UPDATE_REMOTE_ROOT@@/releases/dsh/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        return 404;
    }
}

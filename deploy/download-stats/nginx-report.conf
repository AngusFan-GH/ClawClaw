# Company LAN: http://192.168.103.220:9529/. Keep this port unmapped publicly.
server {
    listen 127.0.0.1:9529;
    listen 192.168.103.220:9529;
    server_name localhost 192.168.103.220;
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;
    root /var/lib/clawclaw-download-stats/report;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|stats\.json|dashboard\.js|dashboard\.css)$ { try_files $uri =404; }
    location / { return 404; }
}

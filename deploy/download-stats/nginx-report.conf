# Rendered from ignored local deployment settings. Keep this port private.
server {
    listen 127.0.0.1:@@STATS_HTTP_PORT@@;
    listen @@STATS_BIND_ADDRESS@@:@@STATS_HTTP_PORT@@;
    server_name localhost @@STATS_BIND_ADDRESS@@;
    allow 127.0.0.1;
@@STATS_ALLOW_RULES@@
    deny all;
    root @@STATS_REPORT_DIR@@;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|stats\.json|dashboard\.js|dashboard\.css)$ { try_files $uri =404; }
    location / { return 404; }
}

# Include in nginx's http context. Do not log query strings or authorization.
log_format clawclaw_download escape=json
    '{"id":"$request_id","time":"$time_iso8601","duration":"$request_time",'
    '"ip":"$remote_addr","ua":"$http_user_agent","method":"$request_method",'
    '"uri":"$uri","status":"$status","bytes":"$body_bytes_sent",'
    '"length":"$sent_http_content_length","range":"$http_range",'
    '"contentRange":"$sent_http_content_range","completion":"$request_completion",'
    '"purpose":"$http_x_clawclaw_download_purpose"}';

map $uri $clawclaw_log_download {
    default 0;
    ~^/releases/dsh/[0-9]+\.[0-9]+\.[0-9]+/ClawClaw-.*\.(dmg|exe)$ 1;
}

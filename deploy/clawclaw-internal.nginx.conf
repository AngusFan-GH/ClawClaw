# Internal download origin; incoming CI uploads are outside this public root.
server {
    listen 80;
    server_name clawclaw.xzinfra.com;
    return 301 https://clawclaw.xzinfra.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clawclaw.xzinfra.com;
    ssl_certificate /etc/clawclaw/tls/xzinfra.com.pem;
    ssl_certificate_key /etc/clawclaw/tls/xzinfra.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /data/clawclaw/public;
    autoindex off;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "clawclaw-internal-release-origin\n";
    }

    location ~ (^|/)\. { return 404; }

    location /updates/dsh/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /releases/dsh/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / { return 404; }
}

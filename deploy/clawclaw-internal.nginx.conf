# Internal download origin; incoming CI uploads are outside this public root.
server {
    listen 80;
    server_name clawclaw.xzinfra.com;
    return 301 https://clawclaw.xzinfra.com:9528$request_uri;
}

server {
    # Public mapping: 218.69.255.22:9528 -> 192.168.103.220:9528.
    # Keep the existing LAN listener during migration.
    listen 443 ssl http2;
    listen 9528 ssl http2;
    server_name clawclaw.xzinfra.com;
    ssl_certificate /etc/clawclaw/tls/xzinfra.com.pem;
    ssl_certificate_key /etc/clawclaw/tls/xzinfra.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Requires download-stats/nginx-log.conf in the http context.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/clawclaw-downloads/downloads.jsonl clawclaw_download if=$clawclaw_log_download;
    root /data/clawclaw/public;
    autoindex off;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "clawclaw-internal-release-origin\n";
    }

    location ~ (^|/)\. { return 404; }

    # 0.2.0 and 0.2.1 read this original JSON endpoint and reject redirects.
    location = /updates/stable/release.json {
        alias /data/clawclaw/public/updates/dsh/stable/release.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Also retain existing legacy feed and historical installer URLs.
    location /updates/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 0.2.11 was replaced in place; revalidate its canonical download URLs.
    location /releases/dsh/0.2.11/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /releases/dsh/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / { return 404; }
}

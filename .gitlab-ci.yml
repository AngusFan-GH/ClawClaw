# Office runners are started on demand. Use Run pipeline or the API on dsh-desktop;
# ordinary pushes and historical tags must not start unattended builds.
workflow:
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == "dsh-desktop"'
    - when: never

stages: [package, assemble]

variables:
  GIT_STRATEGY: clone
  # Packaging uses the pipeline commit, not the outer repository's full history.
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  DSH_TELEMETRY_DISABLED: "1"
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never
  GIT_CONFIG_PARAMETERS: "'credential.helper=' 'http.https://gitlab.xzinfra.com/.proxy='"
  GIT_HTTP_LOW_SPEED_LIMIT: "1024"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  npm_config_registry: "http://192.168.103.203:8081/repository/xzinfra-npm-group/"
  CLAWCLAW_DIRECT_UPLOAD: "1"

default:
  interruptible: false

package-macos:
  stage: package
  tags: [clawclaw-macos]
  resource_group: clawclaw-macos
  timeout: 3 hours
  variables:
    GIT_SUBMODULE_STRATEGY: none
    CLAWCLAW_UPSTREAM_SOURCE: "$CLAWCLAW_MACOS_UPSTREAM_SOURCE"
  script:
    - node scripts/gitlab-desktop-release.mjs build darwin

package-windows:
  stage: package
  tags: [clawclaw-windows]
  resource_group: clawclaw-windows
  timeout: 3 hours
  variables:
    # Reuse the validated office checkout when GitHub is unreachable from Windows.
    GIT_SUBMODULE_STRATEGY: none
    CLAWCLAW_UPSTREAM_SOURCE: "$CLAWCLAW_WINDOWS_UPSTREAM_SOURCE"
  script:
    - node scripts/gitlab-desktop-release.mjs build win32

assemble:
  stage: assemble
  tags: [clawclaw-macos]
  resource_group: clawclaw-macos
  timeout: 30 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: package-macos
      artifacts: false
    - job: package-windows
      artifacts: false
  script:
    - node scripts/gitlab-desktop-release.mjs assemble

# Diagnostic branch only: preserve the previously built checkout and dependencies.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/windows-cli-diagnostics"'
    - when: never
stages: [diagnose]
windows-cli-diagnostics:
  stage: diagnose
  tags: [clawclaw-windows]
  resource_group: clawclaw-windows
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
    DSH_TELEMETRY_DISABLED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $diagnostic = @'
      import { execFileSync, spawnSync } from 'node:child_process'
      import { mkdirSync, mkdtempSync, writeFileSync, rmSync } from 'node:fs'
      import { join, resolve } from 'node:path'
      import { tmpdir } from 'node:os'
      import { createRequire } from 'node:module'
      const root = process.cwd()
      const expected = '2b32703635409b5f3abca04e68e8d5720f0a9774'
      if (execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim() !== expected) throw new Error('Preserved checkout changed')
      const electron = createRequire(join(root,'dsh-plugin-desktop/package.json'))('electron')
      const base = mkdtempSync(join(tmpdir(),'clawclaw-link-diagnostic-'))
      const jobId = process.env.CI_JOB_ID
      const runnerTemporary = resolve(root + '.tmp', 'link-diagnostic-' + jobId)
      mkdirSync(runnerTemporary, {recursive:true})
      const script = join(base,'probe.cjs')
      writeFileSync(script, String.raw`
      const fs = require('node:fs'); const path = require('node:path')
      const settings = JSON.parse(process.argv[2])
      async function main() {
       const filesystems = [['fs',fs]]
       try { filesystems.push(['original-fs',require('original-fs')]) } catch {}
       console.log(JSON.stringify({engine:settings.engine,node:process.version,electron:process.versions.electron,noAsar:process.noAsar}))
       const target = path.join(settings.base,'target-'+settings.engine);fs.mkdirSync(target)
       for (const [name,api] of filesystems) {
        for (const [placement,parent] of settings.parents) {
         if (!fs.existsSync(parent)) { console.log(JSON.stringify({placement,skip:'parent absent'}));continue }
         for (const type of ['dir','junction']) {
          const link = path.join(parent,'.clawclaw-link-'+settings.jobId+'-'+settings.engine+'-'+name+'-'+type)
          let created = false
          try {
           await api.promises.symlink(target,link,type);created=true
           console.log(JSON.stringify({engine:settings.engine,api:name,placement,type,ok:true}))
          } catch (error) {
           console.log(JSON.stringify({engine:settings.engine,api:name,placement,type,ok:false,code:error.code,syscall:error.syscall,message:error.message}))
          } finally { if (created) await api.promises.unlink(link) }
         }
        }
       }
      }
      main().catch(error=>{console.error(error);process.exitCode=1})
      `)
      try {
        const parents = [['temp',base],['runner-temp',runnerTemporary],['pnpm-registry',join(process.env.LOCALAPPDATA,'pnpm','store','v11','projects')]]
        for (const [engine,executable] of [['node',process.execPath],['electron',electron]]) {
          const env = {...process.env}; delete env.ELECTRON_RUN_AS_NODE
          if (engine==='electron') env.ELECTRON_RUN_AS_NODE='1'
          const result = spawnSync(executable,[script,JSON.stringify({engine,base,parents,jobId})],{encoding:'utf8',env,timeout:60000})
          if (result.stdout) process.stdout.write(result.stdout)
          if (result.stderr) process.stderr.write(result.stderr)
          if (result.status!==0) throw result.error ?? new Error(engine+' probe exited '+result.status)
        }
      } finally {
        rmSync(base,{recursive:true,force:true,maxRetries:3})
        rmSync(runnerTemporary,{recursive:true,force:true,maxRetries:3})
      }
      '@
      $diagnostic | & node --input-type=module -
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

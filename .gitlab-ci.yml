# Diagnostic branch only: preserve the previously built checkout and dependencies.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/windows-cli-diagnostics"'
    - when: never
stages: [diagnose]
windows-cli-diagnostics:
  stage: diagnose
  tags: [clawclaw-windows]
  resource_group: clawclaw-windows
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
    DSH_TELEMETRY_DISABLED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      try { Get-CimInstance -Namespace root/SecurityCenter2 -ClassName AntivirusProduct -ErrorAction Stop | Select-Object -ExpandProperty displayName } catch { Write-Output "Antivirus inventory unavailable" }
      try { Get-MpPreference -ErrorAction Stop | Select-Object EnableControlledFolderAccess | Format-List } catch { Write-Output "Defender preference unavailable" }
      foreach ($log in @('Microsoft-Windows-Windows Defender/Operational','Microsoft-Windows-CodeIntegrity/Operational','Microsoft-Windows-AppLocker/EXE and DLL')) {
        try {
          $events = Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=(Get-Date).AddMinutes(-45)} -MaxEvents 200 -ErrorAction Stop
          $events | Where-Object { $_.Message -match 'electron.exe|clawclaw-link-diagnostic' } | Select-Object -First 5 TimeCreated,Id,Message | Format-List
        } catch { Write-Output ("No matching readable events: " + $log) }
      }
      try { Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -ErrorAction Stop | Select-Object AllowDevelopmentWithoutDevLicense | Format-List } catch { Write-Output "Developer-mode value unavailable" }
      $diagnostic = @'
      import { execFileSync, spawnSync } from 'node:child_process'
      import { mkdtempSync, writeFileSync, rmSync } from 'node:fs'
      import { join } from 'node:path'
      import { tmpdir } from 'node:os'
      import { createRequire } from 'node:module'
      const root=process.cwd()
      if (execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!=='2b32703635409b5f3abca04e68e8d5720f0a9774') throw new Error('Preserved checkout changed')
      const require=createRequire(join(root,'dsh-plugin-desktop/package.json'))
      const electron=require('electron');const koffi=require.resolve('koffi')
      const base=mkdtempSync(join(tmpdir(),'clawclaw-winapi-diagnostic-'));const script=join(base,'probe.cjs')
      writeFileSync(script,String.raw`
      const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process')
      const input=JSON.parse(process.argv[2]);const koffi=require(input.koffi)
      const kernel=koffi.load('kernel32.dll')
      const create=kernel.func('uint8_t __stdcall CreateSymbolicLinkW(str16 link, str16 target, uint32_t flags)')
      const lastError=kernel.func('uint32_t __stdcall GetLastError()')
      console.log(JSON.stringify({engine:input.engine,node:process.version,electron:process.versions.electron,uv:process.versions.uv,execArgv:process.execArgv,permission:process.permission?.has('fs.write',input.base)}))
      const advapi=koffi.load('advapi32.dll')
      const current=kernel.func('void * __stdcall GetCurrentProcess()')
      const open=advapi.func('int32_t __stdcall OpenProcessToken(void *, uint32_t, _Out_ void **)')
      const info=advapi.func('int32_t __stdcall GetTokenInformation(void *, uint32_t, _Out_ void *, uint32_t, _Out_ uint32_t *)')
      const lookup=advapi.func('int32_t __stdcall LookupPrivilegeValueW(str16, str16, _Out_ void *)')
      const close=kernel.func('int32_t __stdcall CloseHandle(void *)')
      const handle=[null]
      if(open(current(),8,handle)) {
       try {
        const luid=Buffer.alloc(8),privileges=Buffer.alloc(4096),length=[0],elevation=Buffer.alloc(4)
        const gotLookup=lookup(null,'SeCreateSymbolicLinkPrivilege',luid)
        const gotPrivileges=info(handle[0],3,privileges,privileges.length,length)
        let attributes=null
        if(gotLookup && gotPrivileges) for(let i=0;i<privileges.readUInt32LE(0);i++) {
         const offset=4+i*12
         if(privileges.subarray(offset,offset+8).equals(luid)) attributes=privileges.readUInt32LE(offset+8)
        }
        const gotElevation=info(handle[0],18,elevation,4,length)
        console.log(JSON.stringify({engine:input.engine,tokenElevation:gotElevation?elevation.readUInt32LE(0):null,symlinkPrivilege:attributes}))
       } finally {close(handle[0])}
      }
      const target=path.join(input.base,'target-'+input.engine);fs.mkdirSync(target)
      for(const flags of [1,3]) {
       const link=path.join(input.base,'link-'+input.engine+'-'+flags)
       const ok=create(link,target,flags);const error=lastError()
       console.log(JSON.stringify({engine:input.engine,operation:'CreateSymbolicLinkW',flags,ok,error}))
       if(ok) fs.unlinkSync(link)
      }
      `)
      try {
       for(const [engine,exe] of [['node',process.execPath],['electron',electron]]) {
        const env={...process.env};delete env.ELECTRON_RUN_AS_NODE
        if(engine==='electron')env.ELECTRON_RUN_AS_NODE='1'
        const result=spawnSync(exe,[script,JSON.stringify({engine,base,koffi})],{encoding:'utf8',env,timeout:60000})
        if(result.stdout)process.stdout.write(result.stdout)
        if(result.stderr)process.stderr.write(result.stderr)
        console.log(engine+' probe status='+result.status)
       }
      } finally {rmSync(base,{recursive:true,force:true,maxRetries:3})}
      '@
      $diagnostic | & node --input-type=module -
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

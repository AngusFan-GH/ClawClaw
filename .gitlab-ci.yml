# Diagnostic branch only: preserve the previously built checkout and dependencies.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "codex/windows-cli-diagnostics"'
    - when: never
stages: [diagnose]
windows-cli-diagnostics:
  stage: diagnose
  tags: [clawclaw-windows]
  resource_group: clawclaw-windows
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
    DSH_TELEMETRY_DISABLED: "1"
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $diagnostic = @'
      import { execFileSync, spawnSync } from 'node:child_process'
      import { readFileSync, writeFileSync, unlinkSync } from 'node:fs'
      import { resolve } from 'node:path'
      const root = process.cwd()
      const expected = '2b32703635409b5f3abca04e68e8d5720f0a9774'
      const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
      if (actual !== expected) throw new Error(`Expected preserved checkout ${expected}; found ${actual}`)
      const original = resolve(root, 'dsh-plugin-desktop/scripts/verify-cli-runtime.mjs')
      execFileSync('git', ['diff', '--exit-code', '--', original], { stdio: 'inherit' })
      console.log(`Diagnostic only: cached checkout ${actual}; CI=${process.env.CI}; Node ${process.version}`)
      let failures = 0
      for (let attempt = 1; attempt <= 3; attempt++) {
        const result = spawnSync('corepack.cmd', ['pnpm', '--filter', 'dsh-plugin-desktop', 'verify:cli'], {
          cwd: root, encoding: 'utf8', shell: true, timeout: 90000,
        })
        console.log(`Original CLI attempt ${attempt}: status=${result.status}; signal=${result.signal}`)
        if (result.stdout) process.stdout.write(result.stdout)
        if (result.stderr) process.stderr.write(result.stderr)
        if (result.error) console.log(`Spawn error: ${result.error.code ?? result.error.name}`)
        if (result.status !== 0) failures++
      }
      const temporary = resolve(root, `dsh-plugin-desktop/scripts/verify-cli-diagnostic-${process.env.CI_JOB_ID}.mjs`)
      let source = readFileSync(original, 'utf8')
      if (!source.includes("['install', '--offline', '--reporter=silent']")) throw new Error('Unexpected lifecycle smoke source')
      source = source.replace("['install', '--offline', '--reporter=silent']", "['install', '--offline', '--reporter=append-only']")
      source = source.replace("verifyResult('pnpm lifecycle smoke', result, '')", "verifyResult('pnpm lifecycle smoke', result)")
      source = source.replace('${result.stderr.trim()}', '${JSON.stringify({ stdout: result.stdout, stderr: result.stderr })}')
      try {
        writeFileSync(temporary, source, { flag: 'wx' })
        for (let attempt = 1; attempt <= 3; attempt++) {
          const result = spawnSync(process.execPath, [temporary], {
            cwd: root, encoding: 'utf8', timeout: 90000,
          })
          console.log(`Verbose CLI attempt ${attempt}: status=${result.status}; signal=${result.signal}`)
          if (result.stdout) process.stdout.write(result.stdout)
          if (result.stderr) process.stderr.write(result.stderr)
          if (result.error) console.log(`Spawn error: ${result.error.code ?? result.error.name}`)
          if (result.status !== 0) failures++
        }
      } finally { unlinkSync(temporary) }
      console.log(`CLI diagnostics finished: ${failures} failures; product source unchanged`)
      process.exitCode = failures === 0 ? 0 : 1
      '@
      $diagnostic | & node --input-type=module -
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Office runners are started on demand. Use Run pipeline or the API on dsh-desktop;
# ordinary pushes and historical tags must not start unattended builds.
workflow:
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == "dsh-desktop"'
    - when: never

stages: [package, assemble]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  DSH_TELEMETRY_DISABLED: "1"
  npm_config_registry: "http://192.168.103.203:8081/repository/xzinfra-npm-group/"

default:
  interruptible: false

package-macos:
  stage: package
  tags: [clawclaw-macos]
  resource_group: clawclaw-macos
  timeout: 3 hours
  script:
    - node scripts/gitlab-desktop-release.mjs build darwin
  artifacts:
    name: "clawclaw-macos-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths: [ci-artifacts/darwin/]

package-windows:
  stage: package
  tags: [clawclaw-windows]
  resource_group: clawclaw-windows
  timeout: 3 hours
  script:
    - node scripts/gitlab-desktop-release.mjs build win32
  artifacts:
    name: "clawclaw-windows-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths: [ci-artifacts/win32/]

assemble:
  stage: assemble
  tags: [clawclaw-macos]
  resource_group: clawclaw-macos
  timeout: 30 minutes
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: package-macos
      artifacts: true
    - job: package-windows
      artifacts: true
  script:
    - node scripts/gitlab-desktop-release.mjs assemble
  artifacts:
    name: "clawclaw-release-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths: [release/]

# Branding knobs:
# - productName controls installer/UI naming across platforms
# - appId should stay stable after first public release to preserve update continuity
appId: app.clawclaw.desktop
productName: ClawClaw
copyright: Copyright © 2026 xzinfra (新智惠想科技有限公司). All rights reserved.
compression: normal
artifactName: ${productName}-v${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
      - '!README Portable.txt'
      - '!Start ClawClaw.bat'
      - '!Start ClawClaw.vbs'
      - '!Start ClawClaw.command'
      - '!icons/*.md'
      - '!icons/*.svg'
      - '!bin/**'
      - '!screenshot/**'
  # OpenClaw package (node_modules copied separately by afterPack hook
  # because electron-builder respects .gitignore which excludes node_modules/)
  - from: build/openclaw/
    to: openclaw/
  # NOTE: OpenClaw plugin mirrors (dingtalk, etc.) are bundled by the
  # afterPack hook (after-pack.cjs) directly from node_modules, so they
  # don't need an extraResources entry here.

afterPack: ./scripts/after-pack.cjs

asar: true
asarUnpack:
  - '**/*.node'

# Disable native module rebuilding.
# The Electron renderer/main process has no native (.node) dependencies.
# All native modules (opus, sharp, koffi …) belong to openclaw, which is
# bundled separately (bundle-openclaw.mjs → extraResources) and runs in its
# own process — @electron/rebuild must NOT touch them.
npmRebuild: false

# Use the modern Windows code-signing bundle to avoid symlink extraction
# failures on non-admin Windows sessions.
toolsets:
  winCodeSign: '1.1.0'

# Auto-update configuration
# Published metadata points at the stable generic feed. Runtime channel
# switching is handled in electron/main/updater.ts.
publish:
  - provider: generic
    url: https://clawclaw.xzinfra.com/updates/stable
    useMultipleRangeRequest: false

# macOS Configuration
mac:
  artifactName: ${productName}-v${version}-${arch}.${ext}
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin
    - from: resources/cli/posix/
      to: cli/
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  target:
    - target: zip
      arch:
        - x64
        - arm64
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: ClawClaw requires microphone access for voice features
    NSCameraUsageDescription: ClawClaw requires camera access for video features

dmg:
  background: resources/dmg-background.png
  icon: resources/icons/icon.icns
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - type: file
      x: 130
      y: 220
    - type: link
      path: /Applications
      x: 410
      y: 220

# Windows Configuration
win:
  artifactName: ${productName}-Setup-v${version}-${arch}.${ext}
  forceCodeSigning: false
  verifyUpdateCodeSignature: false
  signAndEditExecutable: true
  extraResources:
    - from: resources/bin/win32-${arch}
      to: bin
    - from: resources/cli/win32/
      to: cli/
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    # Portable directory target — produces release/win-unpacked/ which can be
    # copied directly to a USB drive and run without installation.
    - target: dir
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  runAfterFinish: true
  perMachine: false
  allowElevation: false
  warningsAsErrors: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  menuCategory: ${productName}
  # Differential updates stay enabled on Windows, but the installer now
  # force-cleans managed runtime directories (OpenClaw + bundled plugins)
  # before copying files so incremental upgrades do not keep stale runtime
  # dependencies around.
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  license: resources/legal/EULA.rtf
  include: scripts/installer.nsh
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico

# Linux Configuration
linux:
  extraResources:
    - from: resources/bin/linux-${arch}
      to: bin
    - from: resources/cli/posix/
      to: cli/
  icon: resources/icons
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
  category: Utility
  maintainer: ClawClaw Team <public@xzinfra.com>
  vendor: ClawClaw
  synopsis: AI Assistant powered by OpenClaw
  description: ClawClaw is a graphical AI assistant application that integrates with OpenClaw Gateway to provide intelligent automation and assistance across multiple messaging platforms.
  desktop:
    entry:
      Name: ClawClaw
      Comment: AI Assistant powered by OpenClaw
      Categories: Utility;Network;
      Keywords: ai;assistant;automation;chat;
      StartupWMClass: clawclaw

appImage:
  license: LICENSE

deb:
  depends:
    # Use OR syntax to support both Ubuntu 22.04 and Ubuntu 24.04 (t64 transition).
    # Ubuntu 24.04 renamed many libraries with a t64 suffix (64-bit time_t ABI transition).
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4 | libnotify4t64
    - libnss3
    - libxss1 | libxss1t64
    - libxtst6 | libxtst6t64
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
  afterInstall: scripts/linux/after-install.sh
  afterRemove: scripts/linux/after-remove.sh
